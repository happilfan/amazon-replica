<!DOCTYPE html>
<html>
  <head>
    <title>Amazon Project</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/shared/amazon-sidebar.css">
    <link rel="stylesheet" href="styles/pages/amazon.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo"
            src="images/amazon-logo-white.png">
          <img class="amazon-mobile-logo"
            src="images/amazon-mobile-logo-white.png">
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="text" placeholder="Search">

        <button class="search-button">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>
    
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-link">
            <div class="sidebar-name">Price</div>
            <label class="rating-option"><input type="radio" name="price" value="all" checked>All</label>
            <label class="rating-option"><input type="radio" name="price" value="10">&lt;10$</label>
            <label class="rating-option"><input type="radio" name="price" value="50">&lt;50$</label>
            <label class="rating-option"><input type="radio" name="price" value="100">&lt;100$</label>
        </div>
        <div class="sidebar-link">
            <div class="sidebar-name">Customer Reviews</div>
            <label class="rating-option"><input type="radio" name="reviews" value="all" checked>All</label>
            <label class="rating-option"><input type="radio" name="reviews" value="4"><img class="product-rating-stars" src="images/ratings/rating-40.png"><span>& up</span></label>
            <label class="rating-option"><input type="radio" name="reviews" value="3"><img class="product-rating-stars" src="images/ratings/rating-30.png"><span>& up</span></label>
            <label class="rating-option"><input type="radio" name="reviews" value="2"><img class="product-rating-stars" src="images/ratings/rating-20.png"><span>& up</span></label>
            <label class="rating-option"><input type="radio" name="reviews" value="1"><img class="product-rating-stars" src="images/ratings/rating-10.png"><span>& up</span></label>
        </div>
        <div class="sidebar-link">
            <div class="sidebar-name">Prime Programs</div>
            <label><input type="checkbox">Prime Exclusive</label>
        </div>
    </nav>

    <div class="main">
      <div class="products-grid js-products-grid"></div>
    </div>

    <script type="module" src="scripts/amazon.js"></script>
  </body>
</html>
